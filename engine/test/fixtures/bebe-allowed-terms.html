<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<title>ਬਿੱਲ</title>
<style>
  body { margin: 0; padding: 8px; font: 14px/1.2 sans-serif; }
  p, h1 { margin: 4px 0; }
  h1 { font-size: 18px; }
</style>
</head>
<body>
  <!-- The site's allowed term, in any case. -->
  <h1>Lantern Bills</h1>
  <p>LANTERN BILLS ਵਿੱਚ ਜੀ ਆਇਆਂ ਨੂੰ</p>
  <!-- Numbers and tokens that contain digits. -->
  <p>ਤੁਹਾਡਾ ਬਿੱਲ ₹2,490.00 · ਬਿੱਲ ਨੰਬਰ INV2026-0042 · ref42abc</p>
  <!-- Acronyms of up to four capital letters. -->
  <label for="cvv">CVV</label> <input id="cvv" placeholder="MM/YY">
  <p>ਭੁਗਤਾਨ OTP ਨਾਲ ਪੱਕਾ ਕਰੋ, ATM ਜਾਂ UPI ਰਾਹੀਂ</p>
  <!-- One English word on its own is not enough. -->
  <p>ਭੁਗਤਾਨ Paytm ਨਾਲ ਵੀ ਹੋ ਸਕਦਾ ਹੈ</p>
  <footer>© 2026 Lantern Bills</footer>
</body>
</html>
