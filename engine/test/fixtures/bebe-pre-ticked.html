<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<title>ਭੁਗਤਾਨ</title>
<style>
  body { margin: 0; padding: 8px; font: 16px/1.25 sans-serif; }
  label { display: block; margin: 8px 0; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }
</style>
</head>
<body>
  <p>ਤੁਹਾਡਾ ਬਿੱਲ ₹2,490.00</p>
  <!-- A paid option ticked in advance. -->
  <label><input type="checkbox" id="protection" checked> ₹99 ਲਈ ਭੁਗਤਾਨ ਸੁਰੱਖਿਆ</label>
  <!-- A free option ticked in advance: no amount, so not a paid option. -->
  <label><input type="checkbox" id="receipt" checked> ਈਮੇਲ ਰਸੀਦ ਭੇਜੋ</label>
</body>
</html>
