<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual moving</title>
    <style>
      body { margin: 0; font: 16px/1.4 sans-serif; }
      .target { position: absolute; left: 16px; width: 200px; height: 48px; }
      #pay { top: 100px; }
      #autopay { top: 300px; }
      #out { position: absolute; left: 16px; top: 420px; margin: 0; }
    </style>
  </head>
  <body>
    <button id="pay" class="target" type="button">Pay this bill</button>
    <button id="autopay" class="target" type="button">Set up autopay</button>
    <p id="out">Nothing clicked</p>
    <script>
      var out = document.getElementById('out');
      document.getElementById('pay').addEventListener('click', function () { out.textContent = 'Paid'; });
      document.getElementById('autopay').addEventListener('click', function () { out.textContent = 'Autopay opened'; });
      // The test calls this while the ghost waits its Reaction_Delay: the two buttons swap places.
      window.moveNow = function () {
        document.getElementById('pay').style.top = '300px';
        document.getElementById('autopay').style.top = '100px';
        return performance.now();
      };
    </script>
  </body>
</html>
