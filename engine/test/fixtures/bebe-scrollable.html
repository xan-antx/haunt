<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<title>ਭੁਗਤਾਨ ਸਾਰ</title>
<style>
  body { margin: 0; font: 16px/1.25 sans-serif; }
  /* The same summary, but it scrolls sideways: the amount can be scrolled into view, so it is not cut off. */
  .summary { width: 140px; padding: 8px; border: 2px solid; overflow-x: auto; white-space: nowrap; }
  .summary h2 { margin: 0 0 4px; font-size: 16px; }
  .amount { margin: 0; font-size: 40px; }
</style>
</head>
<body>
  <section class="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">ਭੁਗਤਾਨ ਸਾਰ</h2>
    <p class="amount" id="amount">₹2,490.00</p>
  </section>
</body>
</html>
