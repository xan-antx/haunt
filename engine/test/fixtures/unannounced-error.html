<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unannounced error fixture</title>
    <style>
      body { font-family: sans-serif; }
      .errorText { color: #b00020; font-size: 0.875rem; }
      .note { color: #333; }
      /* Memos: screen-reader-only text (1px box, clipped). */
      .mu-visually-hidden {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      .sr-clip-path { position: absolute; width: 100px; height: 20px; clip-path: inset(50%); }
      .sr-off-left { position: absolute; left: -10000px; top: 0; }
      .sr-one-px { position: absolute; width: 1px; height: 1px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment</h1>
      <label for="card">Card number</label>
      <input id="card" type="text" />
      <label for="expiry">Expiry date</label>
      <input id="expiry" type="text" />
      <div id="slot"></div>
      <div id="live" aria-live="polite"></div>
      <button id="pay" type="button">Pay this bill</button>
    </main>
    <script>
      // Each helper changes the page the way an app would after validation. The test calls them as "actions".
      const slot = document.getElementById('slot');
      const add = (tag, text, attrs) => {
        const el = document.createElement(tag);
        for (const [name, value] of Object.entries(attrs || {})) el.setAttribute(name, value);
        el.textContent = text;
        slot.appendChild(el);
        return el;
      };

      // A visible error with no live region, no role and no link to a field (Lantern Bills' card errors).
      window.showSilentError = (text) => add('div', text, { class: 'errorText' });

      // The same kind of error, inside role="alert".
      window.showAlertError = (text) => add('div', text, { class: 'errorText', role: 'alert' });

      // The error is linked to the focused field with aria-describedby.
      window.showDescribedError = (text, focusId) => {
        add('div', text, { class: 'errorText', id: 'card-error' });
        const field = document.getElementById(focusId || 'card');
        field.setAttribute('aria-describedby', 'card-error');
        field.focus();
      };

      // The error is linked to a field, but a different field has the focus.
      window.showDescribedElsewhere = (text) => {
        add('div', text, { class: 'errorText', id: 'card-error' });
        document.getElementById('card').setAttribute('aria-describedby', 'card-error');
        document.getElementById('expiry').focus();
      };

      // A visible error, and the same text put into an existing aria-live region.
      window.showLiveError = (text) => {
        add('div', text, { class: 'errorText' });
        document.getElementById('live').textContent = text;
      };

      // Plain text with no error class: only its wording says it is an error.
      window.showNote = (text) => add('p', text, { class: 'note' });

      // A "Learn more" disclosure the user has just opened (React-style id): the button has aria-expanded="true"
      // and aria-controls, and the revealed paragraph is its target. This is the payment protection dialog of Lantern Bills.
      window.showDisclosure = (text) => {
        const button = add('button', 'Learn more', { type: 'button', 'aria-expanded': 'true', 'aria-controls': ':r1:' });
        const explanation = add('p', text, { id: ':r1:', class: 'explanation' });
        return [button, explanation];
      };

      // The same explanation with the disclosure closed: aria-expanded="false" and the text hidden.
      window.showClosedDisclosure = (text) => {
        add('button', 'Learn more', { type: 'button', 'aria-expanded': 'false', 'aria-controls': ':r1:' });
        add('p', text, { id: ':r1:', class: 'explanation', hidden: '' });
      };

      // A native <details> the user has opened.
      window.showDetails = (text) => {
        const details = add('details', '', { open: '' });
        const summary = document.createElement('summary');
        summary.textContent = 'More about this';
        const body = document.createElement('p');
        body.textContent = text;
        details.append(summary, body);
      };

      // Memos: error-worded text inside a screen-reader-only span (never visible on screen).
      window.showHiddenSpan = (text, cls, wrapperClass) => {
        const wrapper = add('div', '', { class: wrapperClass || 'field-note' });
        const span = document.createElement('span');
        span.className = cls || 'mu-visually-hidden';
        span.textContent = text;
        wrapper.appendChild(span);
      };

      // Visible text with a screen-reader-only span inside the same element.
      window.showVisibleWithHiddenSpan = (visible, hidden) => {
        const p = add('p', visible + ' ', { class: 'note' });
        const span = document.createElement('span');
        span.className = 'mu-visually-hidden';
        span.textContent = hidden;
        p.appendChild(span);
      };

      window.clearSlot = () => {
        slot.textContent = '';
        document.getElementById('live').textContent = '';
        document.getElementById('card').removeAttribute('aria-describedby');
      };

      window.focusField = (id) => document.getElementById(id).focus();
    </script>
  </body>
</html>
