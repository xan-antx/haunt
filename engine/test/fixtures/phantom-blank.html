<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phantom: blank for 12 seconds</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.4 sans-serif; }
      #pay { display: block; width: 200px; height: 48px; font: inherit; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      // The page stays blank, with no loading sign, for 12 seconds after its load event.
      window.addEventListener('load', function () {
        setTimeout(function () {
          document.getElementById('app').innerHTML =
            '<h1 id="bill">Your bill</h1><button id="pay" type="button">Pay this bill</button>';
        }, 12000);
      });
    </script>
  </body>
</html>
